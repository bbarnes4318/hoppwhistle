name: API image boots

# Builds the API image and starts it. The point is not the build succeeding —
# it is the container reaching a healthy /health, because everything that has
# gone wrong in this area went wrong at import time, after a green build:
# workspace packages whose exports maps pointed at files the image does not
# contain, and a missing Prisma client. A build-only check would have passed
# through all of it.
#
# Runs only when something that can affect the image changes.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/api-image.yml'
  workflow_dispatch:

jobs:
  boot:
    name: Build image and reach /health
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: hopwhistle-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The schema has to exist before the container starts, and migrate deploy
      # cannot replay from scratch (see docs/MIGRATION_DIVERGENCE.md), so this
      # uses db push for the same reason the main workflow does.
      - name: Push schema
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @hopwhistle/api prisma db push --skip-generate --accept-data-loss
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Start the container
        run: |
          docker run -d --name api --network host \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e DATABASE_URL='postgresql://test:test@localhost:5432/test' \
            -e REDIS_URL='redis://localhost:6379' \
            -e JWT_SECRET='ci-only-secret-long-enough-to-pass-validation-0000000000' \
            hopwhistle-api:ci

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:3001/health || true)
            if [ "$code" = "200" ]; then
              echo "healthy after ${i}s:"; cat /tmp/health.json; exit 0
            fi
            # A container that has already exited will never become healthy.
            if [ -z "$(docker ps -q -f name=api)" ]; then
              echo "::error::container exited before becoming healthy"; break
            fi
            sleep 1
          done
          echo "::error::/health did not return 200"
          docker logs api 2>&1 | tail -60
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs api 2>&1 | tail -100

      - name: Stop
        if: always()
        run: docker rm -f api || true
