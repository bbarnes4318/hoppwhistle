name: PR Quality Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [edit-campaign-buyer-fix]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8.15.0'

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    # 45, not 30.
    #
    # This job ran at 22-23 minutes against a 30-minute cap, which is about 25%
    # headroom on a job whose longest steps are a full workspace test suite
    # against real Postgres and Redis. A runner having a bad day is enough to
    # cross it: PR #135 was CANCELLED at 30m20s and then passed in 23m29s on the
    # identical commit, with an 85-second Postgres checkpoint (178,805 files
    # synced) in the log of the run that died.
    #
    # A cancelled job reads as a failed check and sends whoever opened the PR
    # hunting for a defect that is not there. The browser smoke test moved to
    # its own job below, which takes ~10 minutes off this one; the larger cap is
    # so that the next slow runner is absorbed rather than reported as a bug.
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No build step for the workspace packages: they carry a "prepare": "tsup"
      # hook, which pnpm runs for workspace projects during the install above,
      # so ./dist and its declarations already exist by this point. That covers
      # a fresh clone as well, which no CI step could.
      #
      # It replaced a step here that built them explicitly. Without one or the
      # other, six test files are never collected -- four in apps/api
      # (@hopwhistle/shared, @hopwhistle/routing-dsl) and two in apps/worker
      # (@hopwhistle/shared) -- taking 57 tests with them, reported as
      # "Failed to resolve entry for package" and, while this job's test step
      # was continue-on-error, discarded.

      # Lint and Type check are BLOCKING. They used to be advisory because of
      # repo-wide debt -- about 1,800 lint problems and 180 type errors
      # across api and web -- that predated this gate ever passing. That debt
      # is paid down, so both now pass clean, and a failure is a real failure.
      # Do not put continue-on-error back to get a change through: fix the
      # finding, or narrowly suppress it on the one line with a reason.
      #
      # Format check and Build stay advisory for now. Formatting has its own
      # repo-wide debt, and `pnpm build` covers packages outside this gate.
      #
      # `pnpm test` is no longer advisory either -- see the step below.
      - name: Lint
        run: pnpm --filter "!@callfabric/transcriber" --filter "!@callfabric/media" --filter "!@hopwhistle/worker" lint

      - name: Format check
        run: pnpm format:check
        continue-on-error: true

      - name: Type check
        run: pnpm --filter "!@callfabric/transcriber" --filter "!@callfabric/media" typecheck

      # apps/web's `typecheck` script covers only the dialer-v2 slice. This
      # one is the whole app, tests and e2e included.
      - name: Type check (web, whole app)
        run: pnpm --filter @hopwhistle/web typecheck:all

      # `exec`, not a bare `prisma`: without it pnpm looks for a package script
      # by that name, finds none, prints "None of the selected packages has a
      # 'prisma' script" and exits 0. This step has therefore been pushing
      # nothing, silently, on every run -- which went unnoticed because the only
      # suites that needed the schema were in the advisory step below, where
      # their failures were swallowed. dialer-v2.yml already uses `exec`.
      - name: Push Prisma Schema
        run: |
          pnpm --filter @hopwhistle/api exec prisma db push --skip-generate
          # Constraints db push cannot create. Prisma's schema language cannot
          # express a partial unique index, so lead_dial_reservations'
          # one-active-reservation-per-lead guarantee lives in SQL and has to be
          # applied separately. Without it concurrent workers each claim the same
          # lead and several agents dial the same person.
          pnpm --filter @hopwhistle/api db:constraints
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      # Blocking. While it was advisory it hid 19 failing tests in apps/api
      # and apps/media, a third apps/api suite that died in beforeAll before
      # either of its tests ran, and packages/sdk exiting 1 for containing no
      # tests at all. Chasing those down turned up three defects in shipped
      # code: an event-bus subscriber blocking the shared Redis connection, and
      # two in the AI campaign restart endpoint that meant it had never once
      # succeeded.
      #
      # All of it is now fixed, or -- for apps/media's integration test, which
      # targeted a database table and a Python entrypoint that exist nowhere in
      # this repository -- deleted with the reasoning recorded in its commit.
      # The full workspace passes with no failures.
      #
      # Do not put continue-on-error back to get a red build through. A failure
      # here is a real failure; the suites that need a database or Redis refuse
      # to run unless pointed at one nominated as disposable, so they skip
      # loudly rather than passing vacuously.
      - name: Run Tests (Unit & Integration)
        run: pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          # Suites that truncate tables or write real Redis keys refuse to run
          # unless pointed at services explicitly nominated as disposable — a
          # developer's DATABASE_URL is production. The service containers above
          # are exactly that, so those suites run here and skip everywhere else.
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
          TEST_REDIS_URL: redis://localhost:6379

      # domain-migration.test.ts is in the list below rather than left to the
      # advisory `pnpm test` step. Every failure it catches is silent in
      # production -- a rebuild that reverts the browser host, a SIP realm that
      # invalidates every agent credential, the old product name in front of a
      # customer -- so a red run here has to stop the merge.
      - name: Run carrier automation, call-center & security tests (blocking)
        run: >-
          pnpm --filter @hopwhistle/api exec vitest run
          src/__tests__/carrier-rpa-normalization.test.ts
          src/__tests__/carrier-rpa-redaction.test.ts
          src/__tests__/carrier-rpa-isolation.test.ts
          src/__tests__/field-encryption.test.ts
          src/__tests__/automation-routes.test.ts
          src/__tests__/call-center.test.ts
          src/__tests__/quota.test.ts
          src/__tests__/security.test.ts
          src/__tests__/admin-role-drift.test.ts
          src/__tests__/workflow-pnpm-invocations.test.ts
          src/__tests__/db-push-constraints.test.ts
          src/__tests__/domain-migration.test.ts
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          # security.test.ts drives the real endpoints against a real database,
          # so it needs one nominated as disposable. Without this it would skip,
          # and a skipped suite inside a blocking job is a green tick that means
          # nothing -- which is how its predecessor sat broken for so long. The
          # suite asserts this is set whenever CI is, so a missing database
          # fails the build rather than quietly removing the coverage.
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test

      # The browser smoke test used to run here. It is its own job now --
      # `browser-smoke` below -- because it takes about ten minutes on its own
      # and sharing one timeout with a full workspace test suite meant neither
      # had room. They also do not depend on each other, so running them in
      # parallel makes the whole workflow finish sooner rather than later.

      - name: Build
        run: pnpm build
        continue-on-error: true

      - name: Build artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/*/dist
            packages/*/dist
          retention-days: 1

  browser-smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    # Its own job, and deliberately NOT `needs: quality-gates`.
    #
    # It boots the API and the web app and loads every significant route in
    # Chromium, which takes about ten minutes. Inside quality-gates that ten
    # minutes sat on top of a full workspace test suite under one 30-minute cap,
    # so a slow runner cancelled the pair and the cancellation read as a failing
    # check on whoever's PR happened to be running.
    #
    # Split out it has its own budget, it runs at the same time as the suite
    # rather than after it, and when it does fail the failure names itself
    # instead of arriving as "quality gates failed".
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The smoke test signs people in, so it needs the schema. `exec`, not a
      # bare `prisma`: without it pnpm looks for a package script by that name,
      # finds none, and exits 0 having pushed nothing --
      # `workflow-pnpm-invocations.test.ts` fails the build for that shape.
      - name: Push Prisma Schema
        run: pnpm --filter @hopwhistle/api exec prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Install Chromium
        run: pnpm --filter @hopwhistle/web exec playwright install --with-deps chromium

      # Blocking.
      #
      # Three consecutive phases shipped a defect that one load of a page as a
      # platform admin would have caught -- a crash that unmounted the
      # dashboard, fourteen routes answering 401, and a cross-agency page
      # rendering "Choose an agency" with agency-scoped endpoints polling behind
      # it. Every one of them passed CI. Nothing in it had ever rendered a page:
      # apps/api tested the endpoints, which were correct, and apps/web tested
      # source text and pure functions.
      #
      # This boots the API and the web app and loads the three platform-wide
      # landing routes in Chromium as a platform admin with no acting tenant,
      # then every significant route as an agency principal, an agent, a
      # publisher, a buyer and the platform admin inside an agency. It asserts
      # each page rendered, the URL did not move, the prompt is absent, nothing
      # was refused, the page is light and legible (every run of text clears
      # 3:1, every border can be seen), the one dark scope is dark, and the
      # polling settles. See the header of apps/web/e2e/platform-landing.smoke.mjs.
      #
      # It refuses rather than skips when it has no database: a smoke test that
      # skips inside a blocking job is a green tick that means nothing, which is
      # the failure this whole job exists to stop.
      - name: Platform landing smoke test (browser)
        run: pnpm --filter @hopwhistle/web test:smoke
        env:
          CI: true
          NODE_ENV: development
          SMOKE_DATABASE_URL: postgresql://test:test@localhost:5432/test
          SMOKE_REDIS_URL: redis://localhost:6379/2
          JWT_SECRET: platform-smoke-secret-platform-smoke-secret

  sip-tests:
    name: SIP Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality-gates
    # Manual-only for now: this job has never passed in CI (it previously
    # referenced a nonexistent compose file, since corrected). Run on demand
    # via workflow_dispatch; not a blocking PR gate.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start docker compose services
        run: |
          cd infra/docker
          docker compose -f docker-compose.dev.yml up -d postgres redis minio freeswitch kamailio rtpengine
          docker compose -f docker-compose.dev.yml ps

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          sleep 30
          docker compose -f infra/docker/docker-compose.dev.yml ps

      - name: Check service health
        run: |
          docker compose -f infra/docker/docker-compose.dev.yml ps | grep -q "kamailio.*Up" || exit 1
          docker compose -f infra/docker/docker-compose.dev.yml ps | grep -q "freeswitch.*Up" || exit 1

      - name: Run SIP tests
        run: pnpm test:sip:ci
        env:
          KAMAILIO_HOST: localhost
          KAMAILIO_PORT: 5060
          BUYER_HOST: localhost
          BUYER_PORT: 5061

      - name: Collect test logs
        if: failure()
        run: |
          echo "=== Docker Compose Logs ==="
          docker compose -f infra/docker/docker-compose.dev.yml logs --tail=100
          echo "=== FreeSWITCH Logs ==="
          docker compose -f infra/docker/docker-compose.dev.yml logs freeswitch --tail=50
          echo "=== Kamailio Logs ==="
          docker compose -f infra/docker/docker-compose.dev.yml logs kamailio --tail=50

      - name: Cleanup
        if: always()
        run: |
          cd infra/docker
          docker compose -f docker-compose.dev.yml down -v

  summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [quality-gates, browser-smoke, sip-tests]
    if: always()

    steps:
      - name: Check results
        run: |
          # `cancelled` lands here too, and it is worth naming as itself: a job
          # killed by its own timeout is not a test failure, and reporting it as
          # one sends somebody hunting for a defect that does not exist.
          if [ "${{ needs.quality-gates.result }}" = "cancelled" ]; then
            echo "❌ Quality gates was CANCELLED — it hit its timeout, or the run was cancelled."
            echo "   This is not a test failure. Check the job's duration before looking for a bug."
            exit 1
          fi
          if [ "${{ needs.quality-gates.result }}" != "success" ]; then
            echo "❌ Quality gates failed"
            exit 1
          fi
          if [ "${{ needs.browser-smoke.result }}" = "cancelled" ]; then
            echo "❌ Browser smoke test was CANCELLED — it hit its timeout, or the run was cancelled."
            echo "   This is not a test failure. Check the job's duration before looking for a bug."
            exit 1
          fi
          if [ "${{ needs.browser-smoke.result }}" != "success" ]; then
            echo "❌ Browser smoke test failed"
            exit 1
          fi
          if [ "${{ needs.sip-tests.result }}" != "success" ] && [ "${{ needs.sip-tests.result }}" != "skipped" ]; then
            echo "❌ SIP tests failed"
            exit 1
          fi
          echo "✅ All required checks passed"
