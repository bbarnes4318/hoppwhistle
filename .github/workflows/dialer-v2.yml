name: Dialer V2

# Targeted CI for Dialer V2 and the code it touches.
#
# Deliberately scoped rather than running the whole repo suite: the API suite
# needs a live PostgreSQL and `pnpm typecheck` has ~150 pre-existing errors
# across 41 files this branch did not introduce. A job that is red for reasons
# unrelated to the change teaches everyone to ignore it, so this one only
# asserts things this work is actually responsible for.
#
# Every job that uses `pnpm --filter` first asserts the target package exists.
# `pnpm --filter` exits 0 when nothing matches, and apps/dialer-v2/package.json
# was gitignored by a blanket `*.json` rule — so this workflow once reported
# success while running zero tests. A vacuously green job is worse than a red
# one.

on:
  push:
    branches: ['feature/predictive-dialer-v2', main]
    paths:
      - 'apps/dialer-v2/**'
      - 'apps/api/src/lib/dialer-v2-auth.ts'
      - 'apps/api/src/routes/dialer-v2-shadow.ts'
      - 'apps/api/src/services/dialer-v2-shadow-client.ts'
      - 'apps/api/src/services/hopper-preflight.ts'
      - 'apps/api/src/cli/hopper-preflight.ts'
      - 'apps/web/src/app/(dashboard)/dialer-v2-shadow/**'
      - 'apps/web/tsconfig.dialer-v2.json'
      - 'apps/web/vitest.config.ts'
      - '.github/workflows/dialer-v2.yml'
      # The required jobs execute these, so a change to one must re-run CI.
      # Without them the kill-switch guard and the migration checks could be
      # edited — or broken — with nothing running them.
      - 'scripts/ci/**'
      # The enum and the Hopper entrypoint are what the kill-switch guard reads.
      # A change to either must re-evaluate it, and neither lives under a path
      # this workflow otherwise watches.
      - 'apps/api/prisma/schema.prisma'
      - 'apps/api/prisma/migrations/**'
      - 'apps/worker/src/index.ts'
      # The gate, the supervisor, and the Hopper itself. The kill-switch job
      # reads all three, so a change to any must re-evaluate it.
      - 'apps/worker/src/config/**'
      - 'apps/worker/src/services/hopper-supervisor.ts'
      - 'apps/worker/src/services/dialer-worker.ts'
      - 'apps/worker/package.json'
      - 'docs/dialer-v2/**'
      - '.gitignore'
  pull_request:
    paths:
      - 'apps/dialer-v2/**'
      - 'apps/api/src/lib/dialer-v2-auth.ts'
      - 'apps/api/src/routes/dialer-v2-shadow.ts'
      - 'apps/api/src/services/dialer-v2-shadow-client.ts'
      - 'apps/api/src/services/hopper-preflight.ts'
      - 'apps/api/src/cli/hopper-preflight.ts'
      - 'apps/web/src/app/(dashboard)/dialer-v2-shadow/**'
      - 'apps/web/tsconfig.dialer-v2.json'
      - 'apps/web/vitest.config.ts'
      - '.github/workflows/dialer-v2.yml'
      # The required jobs execute these, so a change to one must re-run CI.
      # Without them the kill-switch guard and the migration checks could be
      # edited — or broken — with nothing running them.
      - 'scripts/ci/**'
      # The enum and the Hopper entrypoint are what the kill-switch guard reads.
      # A change to either must re-evaluate it, and neither lives under a path
      # this workflow otherwise watches.
      - 'apps/api/prisma/schema.prisma'
      - 'apps/api/prisma/migrations/**'
      - 'apps/worker/src/index.ts'
      # The gate, the supervisor, and the Hopper itself. The kill-switch job
      # reads all three, so a change to any must re-evaluate it.
      - 'apps/worker/src/config/**'
      - 'apps/worker/src/services/hopper-supervisor.ts'
      - 'apps/worker/src/services/dialer-worker.ts'
      - 'apps/worker/package.json'
      - 'docs/dialer-v2/**'
      - '.gitignore'

concurrency:
  group: dialer-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tracked-files:
    name: required files are tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The root cause of a previously fake-green run. A file that exists
      # locally but is gitignored produces exactly this failure mode, so assert
      # presence on a fresh checkout rather than trusting a local `ls`.
      - name: Assert config files exist on a clean checkout
        run: |
          set -euo pipefail
          missing=0
          for f in \
            apps/dialer-v2/package.json \
            apps/dialer-v2/tsconfig.json \
            apps/dialer-v2/vitest.config.ts \
            apps/dialer-v2/vitest.live.config.ts \
            apps/worker/vitest.config.ts \
            apps/worker/vitest.live.config.ts \
            apps/api/prisma/migrations/20260803000000_add_lead_dial_reservations/migration.sql \
            apps/api/prisma/migrations/20260803000000_add_lead_dial_reservations/down.sql \
            apps/dialer-v2/tsup.config.ts \
            apps/dialer-v2/scripts/smoke.mjs \
            apps/dialer-v2/Dockerfile \
            scripts/ci/hopper-kill-switch-guard.mjs \
            scripts/ci/hopper-kill-switch-guard.selftest.mjs \
            scripts/ci/assignment-migration-checks.mjs \
            docs/dialer-v2/F1_LEAD_STATUS_DIAGNOSIS.md \
            docs/dialer-v2/PHASE_1_STAGING_VALIDATION.md \
            apps/web/tsconfig.dialer-v2.json \
            apps/web/vitest.config.ts
          do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::missing from the repository (gitignored?)"
              missing=1
            fi
          done
          exit "$missing"

  dialer-v2:
    name: dialer-v2 tests, typecheck, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Assert dialer-v2 is a real workspace package
        run: |
          set -euo pipefail
          if ! pnpm ls --filter @hopwhistle/dialer-v2 --depth -1 | grep -q '@hopwhistle/dialer-v2'; then
            echo "::error::pnpm does not see @hopwhistle/dialer-v2 as a workspace project"
            exit 1
          fi

      - name: Typecheck
        run: pnpm --filter @hopwhistle/dialer-v2 typecheck

      - name: Lint
        run: pnpm --filter @hopwhistle/dialer-v2 lint

      - name: Test
        run: |
          set -euo pipefail
          cd apps/dialer-v2
          pnpm exec vitest run --reporter=verbose --reporter=json --outputFile=/tmp/pure-results.json

      # An exit code alone cannot distinguish "everything passed" from "nothing
      # ran". A config change that stopped matching the spec files would be
      # green, which is the failure this whole workflow exists to prevent.
      - name: Assert the pure tests actually ran
        run: |
          set -euo pipefail
          node -e "
            const r = require('/tmp/pure-results.json');
            const passed = r.numPassedTests ?? 0;
            const total = r.numTotalTests ?? 0;
            console.log('pure tests passed', passed, 'of', total);
            if (total < 561 || passed !== total) {
              console.error('::error::expected at least 561 pure tests to run and every one to pass');
              process.exit(1);
            }
          "

      # The default config excludes `*.live.test.ts`. Assert that the exclusion
      # is a routing decision and not a way to hide failing tests: the live
      # files must exist and must be claimed by the live config.
      - name: Assert live suites exist and are routed to the live job
        run: |
          set -euo pipefail
          for f in \
            apps/dialer-v2/src/stores/redis.live.test.ts \
            apps/dialer-v2/src/agents/db-sources.live.test.ts \
            apps/dialer-v2/src/runtime/composition.live.test.ts \
            apps/dialer-v2/src/runtime/postgres-health.live.test.ts
          do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::live suite is missing"
              exit 1
            fi
          done
          if ! grep -q "src/\*\*/\*.live.test.ts" apps/dialer-v2/vitest.config.ts; then
            echo "::error::the default config does not exclude the live suites"
            exit 1
          fi
          if ! grep -q "src/\*\*/\*.live.test.ts" apps/dialer-v2/vitest.live.config.ts; then
            echo "::error::the live config does not include the live suites"
            exit 1
          fi

  dialer-v2-build:
    name: dialer-v2 production build and smoke test
    runs-on: ubuntu-latest

    # This job exists because `pnpm --filter @hopwhistle/dialer-v2 build` failed
    # on a clean checkout with `Could not resolve ".prisma/client/default"` and
    # nothing here noticed, because nothing here built the package. It passed on
    # a developer machine only because an earlier `prisma generate` had left the
    # generated client on disk.
    #
    # Everything below runs from a clean checkout, in the order a deployment
    # would: install, generate, build, then start the artifact that was built.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `@prisma/client` is a declared production dependency of dialer-v2 and is
      # left external by tsup, so the generated client must exist beside it
      # before anything imports it. This is the step whose absence broke the
      # build, and its absence from the Dockerfile broke image builds too.
      - name: Generate the Prisma client
        run: pnpm --filter @hopwhistle/api exec prisma generate

      - name: Assert dialer-v2 declares @prisma/client itself
        run: |
          set -euo pipefail
          node -e "
            const pkg = require('./apps/dialer-v2/package.json');
            const declared = (pkg.dependencies ?? {})['@prisma/client'];
            if (!declared) {
              console.error('::error::@prisma/client must be a direct production dependency of dialer-v2, not hoisted from another workspace');
              process.exit(1);
            }
            console.log('dialer-v2 declares @prisma/client', declared);
          "

      - name: Build
        run: pnpm --filter @hopwhistle/dialer-v2 build

      - name: The artifact exists
        run: test -f apps/dialer-v2/dist/index.js

      # tsup exiting zero says the bundler was satisfied. These assertions are
      # about what it actually emitted.
      - name: Inspect the emitted artifact
        run: |
          set -euo pipefail

          # The generated client must NOT be inlined. If it is, the bundle
          # carries a snapshot that drifts from the schema at the next migration
          # and embeds engine paths resolved on this runner.
          if grep -q "\.prisma/client" apps/dialer-v2/dist/index.js; then
            echo "::error::the bundle inlines the generated Prisma client; it must stay external"
            exit 1
          fi

          # ...but it must still be reachable, as an external import.
          if ! grep -q "@prisma/client" apps/dialer-v2/dist/index.js; then
            echo "::error::the bundle does not reference @prisma/client at all; database composition was dropped"
            exit 1
          fi

          # Development-only imports have no business in a production artifact.
          for forbidden in "vitest" "tsx/" "@vitest/" "node:test"; do
            if grep -q "from\"$forbidden" apps/dialer-v2/dist/index.js; then
              echo "::error::the artifact imports the development-only module $forbidden"
              exit 1
            fi
          done

          # The composition root and the production entrypoint must be in it.
          # Excluding either to make the build pass would be the wrong fix.
          for required in "composeRuntime" "DIALER_V2_RUNTIME_MODE" "health/live"; do
            if ! grep -q "$required" apps/dialer-v2/dist/index.js; then
              echo "::error::the artifact does not contain $required"
              exit 1
            fi
          done

          echo "artifact size: $(wc -c < apps/dialer-v2/dist/index.js) bytes"

      # Started with `node`, from `dist`. Not tsx, not Vitest, not the source.
      - name: Smoke test — test mode
        run: |
          set -euo pipefail
          cd apps/dialer-v2
          node scripts/smoke.mjs \
            --mode test \
            --port 9192 \
            --allow-fail freeswitch_esl,redis,postgres

      # A mistyped mode must stop the service rather than silently selecting the
      # one mode that permits memory and static sources.
      - name: Smoke test — a mistyped mode refuses readiness
        run: |
          set -euo pipefail
          cd apps/dialer-v2
          node scripts/smoke.mjs \
            --mode prodution \
            --expect-mode unresolved \
            --expect-not-ready \
            --allow-any-fail \
            --require-fail runtime_mode \
            --port 9193

  dialer-v2-live:
    name: dialer-v2 against real Redis and PostgreSQL
    runs-on: ubuntu-latest

    # Real services, not mocks. The unit suites drive hand-written fakes that
    # agree with the code by construction; these containers are the only thing
    # that can contradict it.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: dialer
          POSTGRES_PASSWORD: dialer
          POSTGRES_DB: dialer_v2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Without this an unreachable service would skip every test and the job
      # would pass having verified nothing.
      DIALER_V2_REQUIRE_LIVE_SERVICES: 'true'
      DIALER_V2_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      DIALER_V2_TEST_DATABASE_URL: postgresql://dialer:dialer@127.0.0.1:5432/dialer_v2_test?schema=public
      # The composition suite calls composeRuntime exactly as index.ts does, so
      # it reads the same variables the running service reads.
      DATABASE_URL: postgresql://dialer:dialer@127.0.0.1:5432/dialer_v2_test?schema=public
      DIALER_V2_SIP_DOMAIN: live.dialer.test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @hopwhistle/api exec prisma generate

      # `db push` against an ephemeral container, never a production database.
      # The DATABASE_URL here points only at the service container above.
      - name: Create the schema in the throwaway database
        env:
          DATABASE_URL: postgresql://dialer:dialer@127.0.0.1:5432/dialer_v2_test?schema=public
        run: pnpm --filter @hopwhistle/api exec prisma db push --skip-generate --accept-data-loss

      - name: Prove both services are actually reachable
        run: |
          set -euo pipefail
          node -e "
            const { Client } = require('pg');
            (async () => {
              const c = new Client({ connectionString: process.env.DIALER_V2_TEST_DATABASE_URL });
              await c.connect();
              const r = await c.query(\"SELECT to_regclass('public.users') AS t, to_regclass('public.campaign_agents') AS a\");
              if (!r.rows[0].t) { console.error('users table was not created'); process.exit(1); }
              // The assignment table is what lets the composition suite prove a
              // campaign resolves at all. Without it those tests would pass by
              // asserting an empty result, which is what they exist to rule out.
              if (!r.rows[0].a) { console.error('campaign_agents table was not created'); process.exit(1); }
              await c.end();
              console.log('postgres ready, users table present');
            })().catch(e => { console.error(e); process.exit(1); });
          "
          node -e "
            const Redis = require('ioredis');
            const c = new Redis(process.env.DIALER_V2_TEST_REDIS_URL, { maxRetriesPerRequest: 1 });
            c.ping().then(r => { console.log('redis ready:', r); return c.quit(); })
                    .catch(e => { console.error(e); process.exit(1); });
          "

      - name: Live tests
        run: |
          set -euo pipefail
          cd apps/dialer-v2
          pnpm exec vitest run --config vitest.live.config.ts \
            --reporter=verbose --reporter=json --outputFile=/tmp/live-results.json

      # A live job that ran zero tests is the failure mode this whole workflow
      # exists to prevent — the dialer-v2 job was once green having run none.
      # Assert the count, do not trust the exit code.
      - name: Assert the live tests actually ran
        run: |
          set -euo pipefail
          node -e "
            const r = require('/tmp/live-results.json');
            const passed = r.numPassedTests ?? 0;
            const total = r.numTotalTests ?? 0;
            console.log('live tests passed', passed, 'of', total);
            // Raised from 80 as suites were added. A floor below the real count
            // would let a whole file stop being collected without failing here,
            // which is the exact shape of the false green this job exists for.
            if (total < 128 || passed !== total) {
              console.error('::error::expected at least 128 live tests to run and every one to pass');
              process.exit(1);
            }

            // A count alone would not notice the production-composition suite
            // being dropped or renamed. It is the only test that exercises the
            // bundle index.ts actually builds, so it is asserted by name.
            const names = (r.testResults ?? []).map(f => f.name ?? '');
            if (!names.some(n => n.includes('composition.live.test'))) {
              console.error('::error::the production-composition suite did not run');
              process.exit(1);
            }
          "

      # ── The built artifact, in production mode, against these containers ────
      #
      # The live suites above exercise composition from TypeScript through
      # Vitest. That is not the thing that gets deployed. This builds the real
      # bundle and starts it with `node dist/index.js` in production mode, which
      # is the configuration that refuses to start on any memory or static
      # backend — so it can only come up if every Redis and PostgreSQL
      # implementation is genuinely wired.
      #
      # Throwaway service containers only. Nothing here reaches staging or
      # production, ESL ingestion is off, and origination remains disabled.
      - name: Build the artifact
        run: pnpm --filter @hopwhistle/dialer-v2 build

      # The reservation lifecycle. Every claim in this suite is a claim about
      # PostgreSQL — that a partial unique index settles a race, that
      # FOR UPDATE SKIP LOCKED lets several reapers divide work rather than
      # duplicate it — so a hand-written double could only confirm the author's
      # belief. This is the only place they can be contradicted.
      - name: Worker lead-reservation live suite
        run: |
          set -euo pipefail
          cd apps/worker
          pnpm exec vitest run --config vitest.live.config.ts \
            --reporter=verbose --reporter=json --outputFile=/tmp/worker-live-results.json

      - name: Assert the reservation live tests actually ran
        run: |
          set -euo pipefail
          node -e "
            const r = require('/tmp/worker-live-results.json');
            const passed = r.numPassedTests ?? 0;
            const total = r.numTotalTests ?? 0;
            console.log('worker live tests passed', passed, 'of', total);
            if (total < 15 || passed !== total) {
              console.error('::error::expected at least 15 worker live tests to run and every one to pass');
              process.exit(1);
            }
          "

      - name: Smoke test — production composition against throwaway services
        env:
          SMOKE_REDIS_URL: redis://127.0.0.1:6379/14
          SMOKE_DATABASE_URL: postgresql://dialer:dialer@127.0.0.1:5432/dialer_v2_test?schema=public
          SMOKE_SIP_DOMAIN: live.dialer.test
          SMOKE_ALLOWED_TENANT_IDS: smoke-tenant
        run: |
          set -euo pipefail
          cd apps/dialer-v2
          # `freeswitch_esl` and `state_reconstruction` are the only checks
          # permitted to fail: ESL ingestion is deliberately disabled, so nothing
          # has been ingested or reconstructed. Every other failure — a missing
          # Prisma client, a memory fallback, a static source, unfenced decisions
          # — fails this step, and the script additionally asserts each backend
          # by name rather than accepting `ready: false` as good enough.
          node scripts/smoke.mjs \
            --mode production \
            --port 9194 \
            --allow-fail freeswitch_esl,state_reconstruction

  assignment-migration:
    name: assignment migration is additive and reversible
    runs-on: ubuntu-latest

    # Real PostgreSQL. The static checks below prove the SQL says the right
    # thing; only a server can prove it DOES the right thing — that it applies
    # from an empty database, that the objects it claims appear, and that the
    # rollback actually rolls back. A migration whose down.sql has never been
    # executed is not reversible, it is aspirational.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: dialer
          POSTGRES_PASSWORD: dialer
          POSTGRES_DB: migration_check
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # A throwaway service container created and destroyed with this job.
      # No staging or production database is reachable from here.
      DATABASE_URL: postgresql://dialer:dialer@127.0.0.1:5432/migration_check?schema=public
      # The same database without Prisma's `?schema=` parameter. libpq parses the
      # query string strictly and rejects it outright — `invalid URI query
      # parameter: "schema"` — so psql needs its own URL rather than the one
      # Prisma reads.
      PSQL_URL: postgresql://dialer:dialer@127.0.0.1:5432/migration_check

    steps:
      - uses: actions/checkout@v4

      # The migration and its rollback are reviewable artefacts, not something
      # generated at deploy time. A missing down.sql means a change that cannot
      # be backed out of a live database.
      - name: Both directions are tracked
        run: |
          set -euo pipefail
          DIR=apps/api/prisma/migrations/20260802000000_add_campaign_agent_assignments
          test -f "$DIR/migration.sql" || { echo "::error::migration.sql is missing"; exit 1; }
          test -f "$DIR/down.sql" || { echo "::error::down.sql is missing"; exit 1; }

      # Additive only. An ALTER or DROP against an existing table would make this
      # unsafe to apply to a live database, which is a different review entirely.
      - name: The migration alters no existing table
        run: |
          set -euo pipefail
          DIR=apps/api/prisma/migrations/20260802000000_add_campaign_agent_assignments
          if grep -qiE '^\s*(DROP TABLE|DROP COLUMN|ALTER COLUMN|TRUNCATE)' "$DIR/migration.sql"; then
            echo "::error::the migration is not additive"
            exit 1
          fi
          # grep -E has no negative lookahead, so this lists every ALTER TABLE
          # target and fails if any of them is not the new table.
          if grep -oiE '^[[:space:]]*ALTER TABLE "[^"]+"' "$DIR/migration.sql"              | grep -qv 'campaign_agents'; then
            echo "::error::the migration alters a table other than campaign_agents"
            exit 1
          fi

      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        run: pnpm --filter @hopwhistle/api exec prisma generate

      # ── The migration chain, characterised honestly ──────────────────────
      #
      # `prisma migrate deploy` from an empty database currently FAILS, at
      # `20260721_add_call_contact_relation`, with `relation "ai_campaign_calls"
      # does not exist`. That is a pre-existing repository defect discovered by
      # this job, not something this branch introduced — and it is consistent
      # with audit finding F-2, which records that production was built with
      # `prisma db push` rather than from the migration history.
      #
      # This branch does not own that breakage and does not fix it. What it does
      # is pin it: the step passes if the chain applies cleanly (someone fixed
      # it) or if it fails at exactly the known migration, and fails if the
      # breakage moves or spreads. Tracked debt, not hidden debt.
      - name: The migration chain fails only where it is known to fail
        run: |
          set -uo pipefail
          set +e
          OUT=$(pnpm --filter @hopwhistle/api exec prisma migrate deploy 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" -eq 0 ]; then
            echo "the migration chain now applies cleanly from empty — the known breakage is gone"
          elif echo "$OUT" | grep -q '20260721_add_call_contact_relation'; then
            echo "known pre-existing breakage at 20260721_add_call_contact_relation (F-3), unchanged"
          else
            echo "::error::the migration chain fails somewhere NEW — this is not the known breakage"
            exit 1
          fi

      # Reset to a clean database, then build the base state the way production
      # actually was built. `migrate deploy` cannot get us there while the chain
      # is broken, and validating this migration must not be blocked on
      # unrelated debt.
      - name: Rebuild the base state from the schema
        run: |
          set -euo pipefail
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 \
            -c 'DROP SCHEMA public CASCADE' -c 'CREATE SCHEMA public'
          pnpm --filter @hopwhistle/api exec prisma db push --skip-generate --accept-data-loss

      # `db push` creates campaign_agents too, because it is in schema.prisma.
      # Running down.sql removes exactly the objects this migration owns, which
      # leaves precisely the PRE-migration base state a real deployment starts
      # from — and proves down.sql works before anything depends on it.
      # ── The reservation migration ────────────────────────────────────────
      #
      # Same treatment as the assignment one: applied, verified, rolled back,
      # re-applied. The partial unique index is the whole design, so it is
      # asserted by definition rather than only by behaviour — a plain unique
      # index would pass every behavioural test that only ever reserves once,
      # while making a lead dialable exactly one time ever.
      - name: The reservation migration produces its objects
        run: |
          set -euo pipefail
          DIR=apps/api/prisma/migrations/20260803000000_add_lead_dial_reservations
          test -f "$DIR/migration.sql" || { echo "::error::reservation migration.sql is missing"; exit 1; }
          test -f "$DIR/down.sql" || { echo "::error::reservation down.sql is missing"; exit 1; }
          if grep -qiE '^\s*(DROP TABLE|DROP COLUMN|ALTER COLUMN|TRUNCATE)' "$DIR/migration.sql"; then
            echo "::error::the reservation migration is not additive"
            exit 1
          fi
          if grep -oiE '^[[:space:]]*ALTER TABLE "[^"]+"' "$DIR/migration.sql" \
             | grep -qv 'lead_dial_reservations'; then
            echo "::error::the reservation migration alters a table other than lead_dial_reservations"
            exit 1
          fi
          # F-1's whole point: the enum must NOT have gained a member.
          if grep -qiE 'ALTER TYPE "LeadStatus"' "$DIR/migration.sql"; then
            echo "::error::the reservation migration alters LeadStatus; it must not"
            exit 1
          fi

      - name: Wind back to the pre-migration base state
        run: |
          set -euo pipefail
          # `db push` creates everything in schema.prisma, which now includes
          # BOTH of this branch's migrations. Winding both back is what produces
          # the genuine pre-migration base state a deployment starts from.
          RES=apps/api/prisma/migrations/20260803000000_add_lead_dial_reservations
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f "$RES/down.sql"
          DIR=apps/api/prisma/migrations/20260802000000_add_campaign_agent_assignments
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f "$DIR/down.sql"
          node scripts/ci/assignment-migration-checks.mjs at-base-state
      - name: Apply the migration onto the base state
        run: |
          set -euo pipefail
          DIR=apps/api/prisma/migrations/20260802000000_add_campaign_agent_assignments
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f "$DIR/migration.sql"

      - name: The objects the migration claims to create exist
        run: node scripts/ci/assignment-migration-checks.mjs objects-exist
      - name: The database itself rejects a duplicate assignment
        run: node scripts/ci/assignment-migration-checks.mjs duplicate-rejected
      - name: Roll back with down.sql
        run: |
          set -euo pipefail
          DIR=apps/api/prisma/migrations/20260802000000_add_campaign_agent_assignments
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f "$DIR/down.sql"

      - name: The rollback removed exactly what it added, and nothing else
        run: node scripts/ci/assignment-migration-checks.mjs rollback-clean
      - name: Re-apply the migration after the rollback
        run: |
          set -euo pipefail
          DIR=apps/api/prisma/migrations/20260802000000_add_campaign_agent_assignments
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f "$DIR/migration.sql"
          node scripts/ci/assignment-migration-checks.mjs reapplied
      - name: campaign_agents matches the Prisma model exactly
        run: node scripts/ci/assignment-migration-checks.mjs columns-match

      # The reservation migration, against the same base state.
      - name: Apply the reservation migration
        run: |
          set -euo pipefail
          DIR=apps/api/prisma/migrations/20260803000000_add_lead_dial_reservations
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f "$DIR/migration.sql"
          node scripts/ci/assignment-migration-checks.mjs reservation-objects

      - name: Roll the reservation migration back and forward again
        run: |
          set -euo pipefail
          DIR=apps/api/prisma/migrations/20260803000000_add_lead_dial_reservations
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f "$DIR/down.sql"
          node -e "
            const { Client } = require('pg');
            (async () => {
              const c = new Client({ connectionString: process.env.DATABASE_URL });
              await c.connect();
              const t = await c.query(\"SELECT to_regclass('public.lead_dial_reservations') AS t\");
              if (t.rows[0].t) throw new Error('lead_dial_reservations survived the rollback');
              const e = await c.query(\"SELECT 1 FROM pg_type WHERE typname='LeadDialReservationState'\");
              if (e.rowCount !== 0) throw new Error('the reservation enum survived the rollback');
              const leads = await c.query('SELECT COUNT(*)::int AS n FROM leads');
              console.log('rollback clean; leads still holds', leads.rows[0].n, 'row(s)');
              await c.end();
            })().catch(e => { console.error('::error::' + e.message); process.exit(1); });
          "
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f "$DIR/migration.sql"
          node scripts/ci/assignment-migration-checks.mjs reservation-objects
  api-dialer-v2:
    name: api Dialer V2 units
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @hopwhistle/api exec prisma generate

      # Only the Dialer V2 and preflight files. The rest of the API suite needs
      # PostgreSQL and is covered by the existing pr.yml workflow.
      - name: Test
        run: |
          pnpm --filter @hopwhistle/api exec vitest run \
            src/lib/__tests__/dialer-v2-auth.test.ts \
            src/routes/__tests__/dialer-v2-shadow.routes.test.ts \
            src/services/__tests__/dialer-v2-shadow-client.test.ts \
            src/services/__tests__/hopper-preflight.test.ts

  web-supervisor:
    name: web supervisor page compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Assert the scoped config actually covers the page
        run: |
          set -euo pipefail
          if ! grep -q 'dialer-v2-shadow/page.tsx' apps/web/tsconfig.dialer-v2.json; then
            echo "::error::the scoped config does not include page.tsx"
            exit 1
          fi

      # A real compile check for the supervisor page. Before this, the page was
      # never type-checked or built by any automation at all.
      - name: Typecheck web supervisor
        run: pnpm --filter @hopwhistle/web typecheck

      - name: Assert the page itself was compiled
        run: |
          set -euo pipefail
          cd apps/web
          if ! pnpm exec tsc -p tsconfig.dialer-v2.json --listFiles \
               | grep -q 'dialer-v2-shadow/page.tsx'; then
            echo "::error::page.tsx was not part of the compilation"
            exit 1
          fi

      - name: Supervisor page contract tests
        run: pnpm --filter @hopwhistle/web test

  no-origination-path:
    name: no origination path exists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A grep-level backstop for the central safety claim. The unit tests
      # assert the transport refuses these commands; this asserts nobody added
      # a new call site anywhere in the service.
      - name: Assert no call-control command is constructed
        run: |
          set -euo pipefail
          # Exclude the guard itself, its tests, and comment lines (which
          # legitimately discuss these words when explaining the restriction).
          if grep -rnE "\b(originate|bgapi|uuid_transfer|uuid_bridge|uuid_kill|sendmsg)\b" \
               apps/dialer-v2/src \
               --include='*.ts' \
             | grep -v 'socket-transport' \
             | grep -v '\.test\.ts' \
             | grep -vE ':[0-9]+:[[:space:]]*(\*|//|/\*)' ; then
            echo "::error::A call-control command appears outside the read-only guard."
            exit 1
          fi
          echo "No call-control command found outside the guard."

  hopper-kill-switch:
    name: the hopper kill switch and the lead status enum agree
    runs-on: ubuntu-latest

    # Audit finding F-1 is currently the ONLY thing preventing the production
    # Hopper from dialing: it starts unconditionally in apps/worker/src/index.ts
    # and fails on every batch because it writes a LeadStatus value the enum does
    # not contain. Adding that enum member — the change that makes TypeScript
    # compile — removes the interlock, and outbound dialing begins on the next
    # poll about a second later.
    #
    # This job makes the dangerous ordering unmergeable. It never requires the
    # enum member; it only requires that the Hopper be gated BEFORE one appears.
    #
    # See docs/dialer-v2/F1_LEAD_STATUS_DIAGNOSIS.md.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Run first: a guard that has only ever been observed passing is
      # indistinguishable from one that cannot fail. This drives it over
      # fixtures for both safe and dangerous orderings and asserts the exit
      # codes, so the check below means something.
      - name: The guard actually fails when it should
        run: node scripts/ci/hopper-kill-switch-guard.selftest.mjs

      - name: Enum and kill switch are consistent
        run: node scripts/ci/hopper-kill-switch-guard.mjs

      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.0

      - name: Install
        run: pnpm install --frozen-lockfile

      # Required before the worker typechecks at all: several worker modules
      # reference `Prisma.InputJsonValue`, which only exists on the GENERATED
      # client. Without this the typecheck fails across files this branch never
      # touched, for a reason that has nothing to do with the gate.
      - name: Generate the Prisma client
        run: pnpm --filter @hopwhistle/api exec prisma generate

      # The worker's full lint has ~309 pre-existing problems across files this
      # branch never touched, so it is scoped to the gate rather than run whole.
      # A job that is red for unrelated reasons teaches everyone to ignore it.
      - name: Typecheck the worker
        run: pnpm --filter @hopwhistle/worker typecheck

      - name: Lint the gate
        run: |
          set -euo pipefail
          cd apps/worker
          pnpm exec eslint \
            src/config \
            src/services/hopper-supervisor.ts \
            src/services/__tests__ \
            --ext .ts

      - name: The gate, the preflight and the supervisor
        run: |
          set -euo pipefail
          cd apps/worker
          pnpm exec vitest run --reporter=verbose --reporter=json --outputFile=/tmp/worker-results.json

      # The gate is the safety control for an outbound dialer. An exit code
      # alone cannot distinguish "every test passed" from "the suite stopped
      # being collected", and the second reads exactly like the first.
      - name: Assert the gate tests actually ran
        run: |
          set -euo pipefail
          node -e "
            const r = require('/tmp/worker-results.json');
            const passed = r.numPassedTests ?? 0;
            const total = r.numTotalTests ?? 0;
            console.log('worker tests passed', passed, 'of', total);
            if (total < 97 || passed !== total) {
              console.error('::error::expected at least 97 worker tests to run and every one to pass');
              process.exit(1);
            }
            const names = (r.testResults ?? []).map(f => f.name ?? '');
            for (const required of ['hopper-gate.test', 'hopper-preflight.test', 'hopper-supervisor.test']) {
              if (!names.some(n => n.includes(required))) {
                console.error('::error::' + required + ' did not run');
                process.exit(1);
              }
            }
          "

      # The shipped defaults must keep the Hopper off. A workflow, compose file
      # or example env that turns it on would defeat every check above.
      - name: No committed configuration enables the Hopper
        run: |
          set -euo pipefail
          if grep -rn --include='*.yml' --include='*.yaml' --include='*.env' \
               --include='env.example' --include='*.example' --include='Dockerfile*' \
               -E "LEGACY_HOPPER_(ENABLED|ORIGINATION_ENABLED)\s*[:=]\s*['\"]?true" \
               . 2>/dev/null | grep -v node_modules; then
            echo "::error::a committed file enables the legacy Hopper or its origination interlock"
            exit 1
          fi
          echo "no committed configuration enables the Hopper or origination"
