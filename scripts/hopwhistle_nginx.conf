server {
    server_name hopwhistle.com www.hopwhistle.com;

    # STIR/SHAKEN cert serving
    location /.well-known/stir-shaken/ {
        alias /var/www/hopwhistle/.well-known/stir-shaken/;
        add_header Access-Control-Allow-Origin *;
        add_header Content-Type application/x-x509-ca-cert;
    }

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/hopwhistle;
    }

    # API proxy to backend on port 3001
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web app on port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hopwhistle.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hopwhistle.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = hopwhistle.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name hopwhistle.com www.hopwhistle.com;
    return 404; # managed by Certbot


}
