version: '3.8'

services:
  # ===========================================
  # REDIS - Message Queue & Caching
  # ===========================================
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Reachable from BOTH networks, under every name its clients use.
    #
    # This service had no `networks:` key, so starting it from this file alone
    # put it on `default` only — while api, worker and dialer-v2 run on
    # hopwhistle-network. They could not resolve it at all, and logged ~24k
    # connection timeouts a day while every Redis-backed feature (agent state,
    # caps, dedupe, the event bus, dialer-v2 shadow state) silently degraded.
    #
    # The two aliases are both required: api and worker use `redis`, while
    # docker-compose.dialer-v2.yml points at `hopwhistle-redis-dev` — the
    # container_name the dev override would have given this service had it
    # been started with that file.
    networks:
      default:
        aliases:
          - redis
      hopwhistle-network:
        aliases:
          - redis
          - hopwhistle-redis-dev

  # ===========================================
  # CLICKHOUSE - Analytics Database
  # ===========================================
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - '8123:8123'
      - '9000:9000'
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_DB=hopwhistle_analytics
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse_dev
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8123/ping']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ===========================================
  # MINIO - S3-Compatible Storage for Recordings
  # ===========================================
  minio:
    image: minio/minio:latest
    ports:
      - '9002:9000'
      - '9001:9001'
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ===========================================
  # JAEGER - Distributed Tracing
  # ===========================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - '16686:16686'
      - '14268:14268'
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  # ===========================================
  # RTPENGINE - Media Proxy for RTP
  # ===========================================
  rtpengine:
    image: drachtio/rtpengine:latest
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    ports:
      - '22222:22222/udp'
      - '10000-10100:10000-10100/udp'
    environment:
      - LOCAL_IP=${PUBLIC_IP}
      - PORT_MIN=10000
      - PORT_MAX=10100
      - LOG_LEVEL=6
    restart: unless-stopped

  # ===========================================
  # FREESWITCH - Telephony Server
  # ===========================================
  freeswitch:
    build:
      context: ../../
      dockerfile: apps/freeswitch/Dockerfile
      args:
        SIGNALWIRE_TOKEN: ${SIGNALWIRE_TOKEN}
    ports:
      - '5062:5060/udp'
      - '5062:5060/tcp'
      - '5080:5080/udp'
      - '5080:5080/tcp'
      - '5070:5070/udp' # Vapi SIP profile
      - '5070:5070/tcp' # Vapi SIP profile
      - '5063:5061/tcp'
      - '8021:8021/tcp'
      - '8082:8082/tcp' # Verto WebSocket (secure)
      - '8083:8083/tcp' # Verto WebSocket (dev)
      - '7443:7443/tcp' # WSS for WebRTC SIP (Call Center)
      # RTP media ports (audio) - MUST be exposed for call audio to work
      - '16384-16484:16384-16484/udp'
    environment:
      # Hardcoded to verify fix
      - FREESWITCH_ESL_PASSWORD=ClueCon
      - API_URL=http://api:3001
      - API_KEY=${API_KEY:-demo-key}
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=${S3_BUCKET:-hopwhistle-recordings}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_REGION=${S3_REGION:-us-east-1}
      - RECORDINGS_FORMAT=${RECORDINGS_FORMAT:-wav}
      - ENABLE_TLS=${ENABLE_TLS:-false}
      - ENABLE_SRTP=${ENABLE_SRTP:-optional}
      - PUBLIC_IP=${PUBLIC_IP}
      - MEDIA_DOMAIN=${MEDIA_DOMAIN}
      - OUTBOUND_SIP_PROXY=${OUTBOUND_SIP_PROXY}
      - OUTBOUND_SIP_USER=${OUTBOUND_SIP_USER}
      - OUTBOUND_SIP_PASS=${OUTBOUND_SIP_PASS}
      - OUTBOUND_CALLER_ID=${OUTBOUND_CALLER_ID}
      - FRACTEL_DEFAULT_CALLER_ID=${FRACTEL_DEFAULT_CALLER_ID:-${OUTBOUND_CALLER_ID:-12816991120}}
      - SIP_DOMAIN=${SIP_DOMAIN:-freeswitch}
    volumes:
      - freeswitch_recordings:/recordings
      # NOTE: Do NOT mount freeswitch_conf here - config is baked into the image via Dockerfile
      # SSL certs for WSS (WebRTC) on port 7443
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Writable so entrypoint can generate combined wss.pem from fullchain+privkey
      - /etc/letsencrypt/live/hopwhistle.com:/etc/freeswitch/letsencrypt
      # STIR/SHAKEN ES256 private key for local PASSporT signing (local_shaken.lua)
      - /opt/hopwhistle/252L-20250710.key:/etc/freeswitch/stir-shaken/private.key:ro
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================
  # KAMAILIO - SIP Proxy
  # ===========================================
  kamailio:
    build:
      context: ../../
      dockerfile: apps/kamailio/Dockerfile
    ports:
      - '5060:5060/udp'
      - '5060:5060/tcp'
      - '5061:5061/tcp'
    environment:
      - PUBLIC_IP=${PUBLIC_IP}
      - FREESWITCH_NODES=freeswitch:5062
      - RTPENGINE_SOCK=udp:rtpengine:22222
      - DB_URL=${KAMAILIO_DB_URL}
    volumes:
      - kamailio_data:/var/run/kamailio
    depends_on:
      - freeswitch
    restart: unless-stopped

  # ===========================================
  # API - Backend REST API
  # ===========================================
  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - PORT=3001
      - API_KEY=${API_KEY:-demo-key}
      - DATABASE_URL=postgresql://callfabric:callfabric_dev@hopwhistle-postgres-dev:5432/callfabric
      - REDIS_URL=redis://redis:6379
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse_dev
      - CLICKHOUSE_DATABASE=hopwhistle_analytics
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=${S3_BUCKET:-hopwhistle-recordings}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_REGION=${S3_REGION:-us-east-1}
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - SIGNALWIRE_PROJECT_ID=${SIGNALWIRE_PROJECT_ID}
      - SIGNALWIRE_API_TOKEN=${SIGNALWIRE_API_TOKEN}
      - SIGNALWIRE_SPACE=${SIGNALWIRE_SPACE}
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - ENABLE_TRACING=false
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_ENDPOINT=${DEEPSEEK_ENDPOINT:-https://api.deepseek.com/chat/completions}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      # Anveo Direct Carrier Integration
      - ANVEO_API_KEY=${ANVEO_API_KEY}
      - ANVEO_EMAIL=${ANVEO_EMAIL}
      - ANVEO_SECURE_PHRASE=${ANVEO_SECURE_PHRASE}
      - PUBLIC_IP=${PUBLIC_IP}
      # Vapi AI Voice Integration
      - VAPI_API_KEY=${VAPI_API_KEY}
      - API_PUBLIC_URL=${API_PUBLIC_URL:-https://hopwhistle.com}
      # Fish Audio (Voice Studio: cloning, voice management, script preview).
      # Server-side only - this key can clone voices, delete them, and spend
      # credit, so it must never be exposed to the web container.
      - FISH_API_KEY=${FISH_API_KEY}
      - FISH_DEFAULT_MODEL=${FISH_DEFAULT_MODEL:-s2.1-pro-free}
      - FISH_API_BASE=${FISH_API_BASE:-https://api.fish.audio}
      # FronterBot Binding
      - SOCKET_LISTENER_HOST=0.0.0.0
      - SOCKET_LISTENER_PORT=8021
      # TCPA Litigator Validation (Realvalidito)
      - TCPA_API_KEY=${TCPA_API_KEY}
      - TCPA_API_SECRET=${TCPA_API_SECRET}
      # BulkVS Number Provisioning API
      - BULKVS_USERNAME=jimmy@getlifeassurance.com
      - BULKVS_PASSWORD=50e77367256f3bd823f44d13dc1e8d17
      - BULKVS_TRUNK_GROUP=pvn
      # American Amicable carrier-application RPA (values sourced from .env)
      - AMERICAN_AMICABLE_AGENT_ID=${AMERICAN_AMICABLE_AGENT_ID}
      - AMERICAN_AMICABLE_PASSWORD=${AMERICAN_AMICABLE_PASSWORD}
      - AMERICAN_AMICABLE_SIGNATURE_NAME=${AMERICAN_AMICABLE_SIGNATURE_NAME}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY}
      - PUPPETEER_EXECUTABLE_PATH=${PUPPETEER_EXECUTABLE_PATH:-/usr/bin/chromium-browser}
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3001/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    volumes:
      - freeswitch_recordings:/recordings:ro

  # ===========================================
  # WORKER - Background Job Processor
  # ===========================================
  worker:
    build:
      context: ../../
      dockerfile: apps/worker/Dockerfile
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://callfabric:callfabric_dev@hopwhistle-postgres-dev:5432/callfabric
      - REDIS_URL=redis://redis:6379
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse_dev
      - CLICKHOUSE_DATABASE=hopwhistle_analytics
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_ENDPOINT=${DEEPSEEK_ENDPOINT:-https://api.deepseek.com/chat/completions}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      # DIALER / FRONTER CONFIG
      - FREESWITCH_HOST=freeswitch
      - FREESWITCH_ESL_PORT=8021
      # Hardcoded to verify fix
      - FREESWITCH_ESL_PASSWORD=ClueCon
      - OUTBOUND_SIP_PROXY=${OUTBOUND_SIP_PROXY}
      - OUTBOUND_SIP_USER=${OUTBOUND_SIP_USER}
      - OUTBOUND_SIP_PASS=${OUTBOUND_SIP_PASS}
      - MAX_CONCURRENT_CALLS=${MAX_CONCURRENT_CALLS}
      - DIALER_POLL_INTERVAL_MS=${DIALER_POLL_INTERVAL_MS}
      - OUTBOUND_CALLER_ID=${OUTBOUND_CALLER_ID}
      # Worker tells FreeSWITCH to connect to 'api' service hostname
      - SOCKET_LISTENER_HOST=api
      - SOCKET_LISTENER_PORT=8021
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================
  # WEB - Next.js Frontend
  # ===========================================
  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://hopwhistle.com
        - NEXT_PUBLIC_WS_URL=wss://hopwhistle.com
        - NEXT_PUBLIC_API_KEY=${API_KEY:-demo-key}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://hopwhistle.com
      - NEXT_PUBLIC_WS_URL=wss://hopwhistle.com
      - NEXT_PUBLIC_API_KEY=${API_KEY:-demo-key}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      - NEXTAUTH_URL=https://hopwhistle.com
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me}
      - VAPI_API_KEY=${VAPI_API_KEY}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================
  # TRANSCRIBER - Audio Transcription Service
  # ===========================================
  transcriber:
    build:
      context: ../../
      dockerfile: apps/media/transcriber/Dockerfile
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://callfabric:callfabric_dev@hopwhistle-postgres-dev:5432/callfabric
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  clickhouse_data:
  minio_data:
  freeswitch_recordings:
  kamailio_data:

networks:
  default:
    driver: bridge
  # Declared here as well as in docker-compose.dev.yml. Same project name, so
  # both resolve to `docker_hopwhistle-network` — this file therefore works
  # standalone AND merged with the dev override, rather than requiring the
  # network to already exist.
  hopwhistle-network:
    driver: bridge
